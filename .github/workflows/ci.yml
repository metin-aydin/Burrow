name: CI

on:
  push:
    branches: [development, master]
  pull_request:

permissions:
  contents: read

jobs:
  netcore:
    name: Go netcore tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: netcore/go.mod
      - name: Install libopenconnect
        run: sudo apt-get update && sudo apt-get install -y libopenconnect-dev pkg-config
      - name: Vet
        working-directory: netcore
        run: go vet ./...
      - name: Test
        working-directory: netcore
        run: go test -race ./...

  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: netcore/go.mod
      - name: Install dependencies
        run: brew install cmake ninja qt freerdp openconnect
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix freerdp)"
      - name: Build
        run: cmake --build build
      - name: Tests
        run: cd build && ctest --output-on-failure
      - name: Translations
        run: |
          cmake --build build --target Burrow_lupdate
          python3 .github/scripts/i18n-check.py app/i18n/*.ts
          git diff --exit-code -- app/i18n || (echo "::error::Run the Burrow_lupdate target and commit app/i18n"; exit 1)

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/release-notes-test.py
