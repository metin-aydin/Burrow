name: CI

on:
  push:
    branches: [development, master]
  pull_request:

permissions:
  contents: read

jobs:
  netcore:
    name: Go netcore tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
      - name: Install libopenconnect
        run: sudo apt-get update && sudo apt-get install -y libopenconnect-dev pkg-config
      - name: Vet
        working-directory: netcore
        run: go vet ./...
      - name: Test
        working-directory: netcore
        run: go test -race ./...

  vulncheck:
    name: Known Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
      - name: Install libopenconnect
        run: sudo apt-get update && sudo apt-get install -y libopenconnect-dev pkg-config
      - name: govulncheck
        working-directory: netcore
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...   # pinned; bump deliberately (v1.1.4 panics on Go 1.27 syntax)

  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
      - name: Install dependencies
        run: brew install cmake ninja qt freerdp openconnect
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix freerdp)"
      - name: Build
        run: cmake --build build
      - name: Tests
        run: cd build && ctest --output-on-failure
      - name: Translations
        run: |
          cmake --build build --target Burrow_lupdate
          python3 .github/scripts/i18n-check.py app/i18n/*.ts
          git diff --exit-code -- app/i18n || (echo "::error::Run the Burrow_lupdate target and commit app/i18n"; exit 1)

  linux:
    name: Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
      # Qt 6.10+ and FreeRDP 3.33+ aren't in Ubuntu 24.04; tools/linux-deps.sh builds them once per change.
      # Only pushes to our own branches write the cache; pull requests may read it but never fill it,
      # so a pull request can't plant binaries that later runs would execute.
      - name: Restore Qt and FreeRDP
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/burrow-deps
          key: linux-deps-${{ runner.arch }}-${{ hashFiles('tools/linux-deps.sh') }}
      - name: Install dependencies
        run: tools/linux-deps.sh /home/runner/burrow-deps
      - name: Save Qt and FreeRDP
        if: github.event_name == 'push' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/burrow-deps
          key: linux-deps-${{ runner.arch }}-${{ hashFiles('tools/linux-deps.sh') }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="/home/runner/burrow-deps/qt;/home/runner/burrow-deps/freerdp"
      - name: Build
        run: cmake --build build
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: /home/runner/burrow-deps/freerdp/lib
        run: cd build && ctest --output-on-failure
      - name: AppImage
        run: tools/package-appimage.sh build 0.0.0-ci /home/runner/burrow-deps

  windows:
    name: Windows build
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
          cache-dependency-path: netcore/go.sum
      # MSYS2 UCRT64 (ADR 0010): gcc for cgo and the app, Qt 6, FreeRDP 3, OpenSSL. "inherit" keeps the Go
      # installed above on PATH.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
      # libopenconnect is built from source by tools/windows-deps.sh. Only pushes to our own branches write
      # the cache; pull requests may read it but never fill it.
      - name: Restore libopenconnect
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: C:/burrow-deps
          key: windows-deps-${{ hashFiles('tools/windows-deps.sh', 'tools/windows/openconnect-pipe-tun.patch') }}
      - name: Install dependencies
        run: tools/windows-deps.sh C:/burrow-deps
      - name: Save libopenconnect
        if: github.event_name == 'push' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/burrow-deps
          key: windows-deps-${{ hashFiles('tools/windows-deps.sh', 'tools/windows/openconnect-pipe-tun.patch') }}
      - name: Go tests
        working-directory: netcore
        env:
          CGO_ENABLED: "1"
        run: |
          export PATH="/c/burrow-deps/bin:$PATH" PKG_CONFIG_PATH=/c/burrow-deps/lib/pkgconfig
          go vet ./...
          go test ./...
      - name: Configure
        run: |
          # POSIX form: MSYS2 splits a C:/ path at the colon, and converts this one for native programs.
          export PKG_CONFIG_PATH=/c/burrow-deps/lib/pkgconfig
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          export PKG_CONFIG_PATH=/c/burrow-deps/lib/pkgconfig   # Go asks pkg-config while building
          cmake --build build
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="/c/burrow-deps/bin:$PATH"
          cd build && ctest --output-on-failure
      - name: Package
        run: tools/package-windows.sh build 0.0.0 C:/burrow-deps

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/release-notes-test.py
