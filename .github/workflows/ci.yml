name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, master]

permissions:
  contents: read

jobs:
  netcore:
    name: Go netcore tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: netcore/go.mod
      - name: Vet
        working-directory: netcore
        run: go vet ./...
      - name: Test
        working-directory: netcore
        run: go test -race ./...

  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: netcore/go.mod
      - name: Install dependencies
        run: brew install cmake ninja qt freerdp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build build
