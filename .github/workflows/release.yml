# Every merge into master publishes a new release (ADR 0002, same flow as the author's JumpDesk/UPaste):
# the version comes from Conventional Commits (.github/scripts/next-version.sh), the merged PR's description becomes
# the release notes, each platform's packages are uploaded to a draft release, and once all builds succeed a
# latest.json update manifest is attached and the release is published. A failed run deletes its draft.
# The in-app updater reads releases/latest/download/latest.json.
name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=$(bash .github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')
          body=""
          if [ -n "$pr" ]; then
            body=$(gh pr view "$pr" --json body --jq .body | python3 .github/scripts/release-notes.py)
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body=$(git log ${last:+$last..}HEAD --no-merges --format='- %s')
          fi
          {
            printf '%s\n' "$body"
            if [ -n "$last" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...v%s\n' \
                "$GITHUB_REPOSITORY" "$last" "$VERSION"
            fi
          } > notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft left behind by an earlier, failed run is removed first.
          if gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Burrow $VERSION" --notes-file notes.md

  build:
    needs: prepare
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    # Signing secrets live in the "release" environment, which only protected branches can use.
    environment: release
    strategy:
      matrix:
        include:
          # Apple Silicon. Intel joins when that port lands; Linux and Windows have their own jobs below.
          - os: macos-15
            platform: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
      - name: Install dependencies
        run: brew install cmake ninja qt freerdp openconnect
      # The macOS build must be signed with Developer ID and notarized; without the secrets the release stops
      # (an unsigned app is blocked by Gatekeeper and cannot update itself). Same secret names as JumpDesk.
      - name: Check signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing; the macOS build cannot be signed."
              exit 1
            fi
          done
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix freerdp)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBURROW_VERSION=${{ needs.prepare.outputs.version }}
          cmake --build build
          (cd build && ctest --output-on-failure)
      - name: Bundle Qt, QML and libraries
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/app/Burrow.app -qmldir=app/qml -always-overwrite
          tools/mac-bundle-ossl-modules.sh build/app/Burrow.app
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(uuidgen)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements app/resources/entitlements.mac.plist \
            --sign "Developer ID Application" build/app/Burrow.app
          codesign --verify --deep --strict --verbose=2 build/app/Burrow.app
      - name: Package
        run: |
          v=${{ needs.prepare.outputs.version }}
          mkdir -p dist
          hdiutil create -volname Burrow -srcfolder build/app/Burrow.app -ov -format UDZO \
            "dist/Burrow-$v-${{ matrix.platform }}.dmg"
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          v=${{ needs.prepare.outputs.version }}
          xcrun notarytool submit "dist/Burrow-$v-${{ matrix.platform }}.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "dist/Burrow-$v-${{ matrix.platform }}.dmg"
          # The update package is the stapled app itself, zipped.
          xcrun stapler staple build/app/Burrow.app
          ditto -c -k --keepParent build/app/Burrow.app "dist/Burrow-$v-${{ matrix.platform }}.zip"
      - name: Update manifest fragment
        run: |
          v=${{ needs.prepare.outputs.version }}
          f="Burrow-$v-${{ matrix.platform }}.zip"
          python3 - "$f" "${{ matrix.platform }}" <<'PY'
          import hashlib, json, os, sys
          name, platform = sys.argv[1], sys.argv[2]
          path = os.path.join("dist", name)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          json.dump({platform: {"name": name, "sha256": digest, "size": os.path.getsize(path)}},
                    open(f"fragment-{platform}.json", "w"))
          PY
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" dist/* --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: fragment-${{ matrix.platform }}
          path: fragment-${{ matrix.platform }}.json

  # Linux: an AppImage that carries Qt, FreeRDP and openconnect (Ubuntu 24.04 baseline, so it runs on
  # 24.04 and newer). No update manifest entry yet: in-app updates on Linux follow later.
  linux:
    needs: prepare
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    # Same protection as the macOS build: only protected branches can use this environment.
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
      - name: Install dependencies
        run: tools/linux-deps.sh /opt/burrow-deps
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: /opt/burrow-deps/freerdp/lib
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/opt/burrow-deps/qt;/opt/burrow-deps/freerdp" \
            -DBURROW_VERSION=${{ needs.prepare.outputs.version }}
          cmake --build build
          (cd build && ctest --output-on-failure)
      - name: Package
        run: |
          tools/package-appimage.sh build ${{ needs.prepare.outputs.version }} /opt/burrow-deps
          cd dist && for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" dist/*.AppImage dist/*.AppImage.sha256 --clobber

  # Windows (ADR 0010, same shape as JumpDesk): a per-user NSIS installer, which is also the in-app update
  # package, and a portable zip. Unsigned for now: when a code signing certificate arrives, a signing step
  # goes here and the updater starts requiring the same publisher on its own.
  windows:
    needs: prepare
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    environment: release
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: netcore/go.mod
          cache-dependency-path: netcore/go.sum
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
      - name: Install dependencies
        run: tools/windows-deps.sh C:/burrow-deps
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="/c/burrow-deps/bin:$PATH" PKG_CONFIG_PATH=/c/burrow-deps/lib/pkgconfig
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBURROW_VERSION=${{ needs.prepare.outputs.version }}
          cmake --build build
          (cd build && ctest --output-on-failure)
      - name: Package
        run: |
          tools/package-windows.sh build ${{ needs.prepare.outputs.version }} C:/burrow-deps
          tools/windows/smoke-test.sh dist/Burrow-${{ needs.prepare.outputs.version }}-windows-x64-portable.zip
          cd dist && for f in *.exe *.zip; do sha256sum "$f" > "$f.sha256"; done
      - name: Update manifest fragment
        run: |
          f="Burrow-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          printf '{"windows-x64": {"name": "%s", "sha256": "%s", "size": %s}}\n' \
            "$f" "$(sha256sum "dist/$f" | cut -d' ' -f1)" "$(stat -c %s "dist/$f")" > fragment-windows-x64.json
          cat fragment-windows-x64.json
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" dist/*.exe dist/*.zip dist/*.sha256 --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: fragment-windows-x64
          path: fragment-windows-x64.json

  publish:
    needs: [prepare, build, linux, windows]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
      - name: Update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          assets = {}
          for f in glob.glob("fragment-*/*.json"):
              assets.update(json.load(open(f)))
          manifest = {"version": os.environ["VERSION"], "notes": open("notes/notes.md").read(), "assets": assets}
          json.dump(manifest, open("latest.json", "w"), indent=1)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v$VERSION" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  discard:
    needs: [prepare, build, linux, windows, publish]
    if: failure() && needs.prepare.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
