# Weekly update proposals for the workflow actions and the Go modules (pull requests into development).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /netcore
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      go:
        patterns: ["*"]
